<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a0f">
  <title>iPhone Duo</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080a0f;
    }
    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    model-viewer {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 48%, #202633 0%, #10141d 52%, #080a0f 100%);
      --poster-color: transparent;
      outline: none;
    }
  </style>
</head>
<body>
  <model-viewer
    id="phone"
    src="./iPhone%20duo.glb"
    alt="iPhone Duo"
    camera-controls
    touch-action="pan-y"
    interaction-prompt="none"
    environment-image="neutral"
    exposure="1"
    shadow-intensity="1"
    shadow-softness="0.8"
    camera-orbit="35deg 75deg 0.22m"
    field-of-view="25deg"
    min-camera-orbit="auto auto 0.12m"
    max-camera-orbit="auto auto 0.8m"
    interpolation-decay="100"
    loading="eager">
  </model-viewer>
</body>
</html>
